[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-qwen"
version = "0.1.0"
description = "Reproducing AgenticQwen: Dual Data Flywheels + GRPO RL for small agentic LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.0",
    "tenacity>=8.0",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "datasets>=2.20",
    "transformers>=4.45",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.5",
]
# Install only on GPU server (Linux + CUDA)
# Usage: uv sync --extra training
training = [
    "torch>=2.3",
    # flash-attn: install separately on GPU server
    # pip install flash-attn --no-build-isolation
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_qwen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv]
# Mac 开发环境：跳过 GPU-only 包
# GPU 训练服务器上另行安装 training extras
environments = ["sys_platform != 'darwin' or extra != 'training'"]
