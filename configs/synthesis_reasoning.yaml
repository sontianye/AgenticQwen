# Reasoning flywheel synthesis configuration

# Seed datasets (HotpotQA / 2WikiMultiHopQA JSONL format)
seed_data:
  - "data/seed_tasks/hotpotqa_train.jsonl"
  - "data/seed_tasks/2wikimultihopqa_train.jsonl"

# Failure samples from the previous training round (used for iterative expansion)
failure_samples_file: "data/synthesized/reasoning/failures.jsonl"

# Output
output_dir: "data/synthesized/reasoning"

# Persona bank (same file as the agentic flywheel)
personas_file: "data/personas/personas_5k.jsonl"

# Concurrency
concurrency: 20

# Self-instruct expansion: variants generated per input sample
expand_factor: 3

# Persona injection: fraction of expanded samples that receive persona context
persona_inject_ratio: 0.5

# Consistency filter: number of independent samples required for agreement
consistency_samples: 3
consistency_temperature: 0.7

# Checkpoint file for resumable runs
checkpoint_file: "data/synthesized/reasoning/.checkpoint.jsonl"
